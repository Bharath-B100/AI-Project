spring:
  datasource:
    url: jdbc:h2:file:./data/aipmdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c5e7b3d1c8f6e0b4d9a2f1c8e3b5d6c7b9e0f2d4c5a6b8d9e0f1c2a3b4c}
