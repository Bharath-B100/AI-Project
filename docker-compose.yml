version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aipm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aipm_db
      POSTGRES_USER: aipm_user
      POSTGRES_PASSWORD: aipm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm_user -d aipm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
